<style>
/* Layout: vitrine editorial — creme como base, fotografias em moldura de arco (a vitrine), rosa profundo só onde há ação. */
:root{
  /* paleta Vitrinii: #E3BFC3 → #DD7A83 em degradê, tema único */
  --bg:#E3BFC3; --surface:#FFF6F7; --blush:rgba(255,255,255,.34); --blush-2:rgba(255,255,255,.22);
  --rose:#9E3E4B; --rose-deep:#8E3743; --gold:#DD7A83; --ink:#3A1F26; --muted:#5A3740; --line:rgba(58,31,38,.16);
  --btn-bg:#8E3743; --btn-fg:#FFFFFF; --btn-hover:#7A2E39;
  --ok:#235C41; --ok-bg:#E3F1E9; --warn:#7A4E0E; --warn-bg:#FBEFD9; --bad:#8E2424; --bad-bg:#F9E1E1; --info:#3E4278; --info-bg:#E8E8F6;
  --demo:#4E3480; --demo-bg:#ECE5F7;
  --ink-bg:#3A1F26; --ink-fg:#FFF4F5; --ink-muted:#E6C9CD; --ink-accent:#E3BFC3;
  --on-grad:#3A1F26;
  --grad-page:linear-gradient(160deg,#E3BFC3 0%,#E2A6AC 48%,#DD7A83 100%);
  --grad-main:linear-gradient(120deg,#E3BFC3 0%,#DD7A83 100%);
  --grad-rev:linear-gradient(120deg,#DD7A83 0%,#E3BFC3 100%);
  --grad-soft:linear-gradient(135deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.06) 100%);
  --grad-alt:linear-gradient(180deg,rgba(255,255,255,.24) 0%,rgba(255,255,255,.1) 100%);
  --grad-btn:linear-gradient(120deg,#B4525D 0%,#8E3743 100%);
  --shadow:0 18px 40px -24px rgba(90,30,40,.45);
  --f-display:"Cormorant Garamond","Cormorant",Garamond,Georgia,serif;
  --f-body:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  --radius:14px;
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#E3BFC3; --surface:#FFF6F7; --blush:rgba(255,255,255,.34); --blush-2:rgba(255,255,255,.22);
  --rose:#9E3E4B; --rose-deep:#8E3743; --gold:#DD7A83; --ink:#3A1F26; --muted:#5A3740; --line:rgba(58,31,38,.16);
  --btn-bg:#8E3743; --btn-fg:#FFFFFF; --btn-hover:#7A2E39;
  --ok:#235C41; --ok-bg:#E3F1E9; --warn:#7A4E0E; --warn-bg:#FBEFD9; --bad:#8E2424; --bad-bg:#F9E1E1; --info:#3E4278; --info-bg:#E8E8F6;
  --demo:#4E3480; --demo-bg:#ECE5F7;
  --ink-bg:#3A1F26; --ink-fg:#FFF4F5; --ink-muted:#E6C9CD; --ink-accent:#E3BFC3;
  --on-grad:#3A1F26;
  --grad-page:linear-gradient(160deg,#E3BFC3 0%,#E2A6AC 48%,#DD7A83 100%);
  --grad-main:linear-gradient(120deg,#E3BFC3 0%,#DD7A83 100%);
  --grad-rev:linear-gradient(120deg,#DD7A83 0%,#E3BFC3 100%);
  --grad-soft:linear-gradient(135deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.06) 100%);
  --grad-alt:linear-gradient(180deg,rgba(255,255,255,.24) 0%,rgba(255,255,255,.1) 100%);
  --grad-btn:linear-gradient(120deg,#B4525D 0%,#8E3743 100%);
  --shadow:0 18px 40px -24px rgba(90,30,40,.45); color-scheme:light }}
:root[data-theme="dark"]{
  --bg:#E3BFC3; --surface:#FFF6F7; --blush:rgba(255,255,255,.34); --blush-2:rgba(255,255,255,.22);
  --rose:#9E3E4B; --rose-deep:#8E3743; --gold:#DD7A83; --ink:#3A1F26; --muted:#5A3740; --line:rgba(58,31,38,.16);
  --btn-bg:#8E3743; --btn-fg:#FFFFFF; --btn-hover:#7A2E39;
  --ok:#235C41; --ok-bg:#E3F1E9; --warn:#7A4E0E; --warn-bg:#FBEFD9; --bad:#8E2424; --bad-bg:#F9E1E1; --info:#3E4278; --info-bg:#E8E8F6;
  --demo:#4E3480; --demo-bg:#ECE5F7;
  --ink-bg:#3A1F26; --ink-fg:#FFF4F5; --ink-muted:#E6C9CD; --ink-accent:#E3BFC3;
  --on-grad:#3A1F26;
  --grad-page:linear-gradient(160deg,#E3BFC3 0%,#E2A6AC 48%,#DD7A83 100%);
  --grad-main:linear-gradient(120deg,#E3BFC3 0%,#DD7A83 100%);
  --grad-rev:linear-gradient(120deg,#DD7A83 0%,#E3BFC3 100%);
  --grad-soft:linear-gradient(135deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.06) 100%);
  --grad-alt:linear-gradient(180deg,rgba(255,255,255,.24) 0%,rgba(255,255,255,.1) 100%);
  --grad-btn:linear-gradient(120deg,#B4525D 0%,#8E3743 100%);
  --shadow:0 18px 40px -24px rgba(90,30,40,.45); color-scheme:light }

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rose-deep);outline-offset:3px;border-radius:4px}
.wrap{max-width:1240px;margin:0 auto;padding-left:var(--gut-l);padding-right:var(--gut-r)}
h1,h2,h3{font-family:var(--f-display);font-weight:500;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1 em,h2 em{font-style:italic;color:var(--rose)}
p{margin:0}
.eyebrow{font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tab{font-variant-numeric:tabular-nums}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:48px;padding:0 1.4rem;border-radius:999px;border:1px solid transparent;font-weight:600;font-size:.95rem;text-decoration:none;cursor:pointer;transition:background .2s,color .2s,border-color .2s,transform .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--btn-bg);color:var(--btn-fg)}
.btn-primary:hover{background:var(--btn-hover)}
.btn-ghost{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn-ghost:hover{background:var(--ink);color:var(--bg)}
.btn-soft{background:var(--blush);color:var(--ink)}
.btn-soft:hover{background:var(--line)}
.btn-wa{background:#1F7A4D;color:#fff}
.btn-wa:hover{background:#17623D}
.btn-sm{min-height:38px;padding:0 1rem;font-size:.85rem}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn-block{width:100%}
.link{background:none;border:0;padding:0;color:var(--rose-deep);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:600}
.icon{width:20px;height:20px;flex:none}

/* top bar + header */
.topbar{background:var(--blush);font-size:.8rem;letter-spacing:.04em;text-align:center}
.topbar .wrap{padding-block:.5rem;display:flex;gap:.75rem;justify-content:center;align-items:center;flex-wrap:wrap}
.topbar.demo{background:var(--demo-bg);color:var(--demo);font-weight:600}
.site-header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.site-header .wrap{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1rem;padding-block:.6rem}
.logo img{height:46px;width:auto}
.nav{display:flex;gap:1.6rem;justify-content:center;font-size:.92rem;font-weight:500}
.nav a{text-decoration:none;padding:.4rem 0;border-bottom:1px solid transparent}
.nav a:hover,.nav a[aria-current="page"]{border-color:var(--rose)}
.hdr-actions{display:flex;gap:.25rem;align-items:center}
.icon-btn{position:relative;width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:var(--blush)}
.cart-count{position:absolute;top:4px;right:2px;min-width:18px;height:18px;border-radius:9px;background:var(--btn-bg);color:var(--btn-fg);font-size:.68rem;font-weight:700;display:grid;place-items:center;padding:0 4px}
.menu-btn{display:none}
@media (max-width:900px){
  .nav{display:none}
  .menu-btn{display:grid}
  .site-header .wrap{grid-template-columns:auto 1fr auto}
  .logo{justify-self:center}
  .logo img{height:38px}
}
.mobile-nav{position:fixed;inset:0;z-index:80;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 1rem) var(--gut-r) 1.5rem var(--gut-l);display:flex;flex-direction:column;gap:.25rem;overflow:auto}
.mobile-nav a{font-family:var(--f-display);font-size:1.8rem;text-decoration:none;padding:.35rem 0;border-bottom:1px solid var(--line)}
.mobile-nav .close{align-self:flex-end}

/* hero */
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(1.5rem,4vw,4rem);align-items:center;padding-block:clamp(2rem,5vw,4.5rem)}
.hero h1{font-size:clamp(2.7rem,6.4vw,5.6rem);font-weight:400}
.hero h1 em{display:block}
.hero .sub{font-size:clamp(1.02rem,1.4vw,1.18rem);color:var(--muted);max-width:34ch;margin-top:1.4rem}
.hero .ctas{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:2rem}
.hero .facts{display:flex;gap:1.5rem;flex-wrap:wrap;margin-top:2.2rem;font-size:.85rem;color:var(--muted)}
.hero .facts span{display:flex;align-items:center;gap:.45rem}
.hero .facts span::before{content:"";width:6px;height:6px;transform:rotate(45deg);background:var(--gold)}
.arch{position:relative;border-radius:999px 999px var(--radius) var(--radius);overflow:hidden;aspect-ratio:4/5.2;max-width:100%;background:var(--blush-2);box-shadow:var(--shadow)}
.arch img{width:100%;height:100%;object-fit:cover;object-position:50% 62%}
.arch-cap{position:absolute;left:1rem;right:1rem;bottom:1rem;display:flex;justify-content:space-between;align-items:center;gap:.75rem;background:color-mix(in srgb,var(--surface) 90%,transparent);border-radius:999px;padding:.55rem .6rem .55rem 1.1rem;font-size:.82rem;text-decoration:none}
.arch-cap b{font-weight:600}
.arch-cap .go{width:34px;height:34px;border-radius:50%;background:var(--btn-bg);color:var(--btn-fg);display:grid;place-items:center;flex:none}
.hero-figure{position:relative;justify-self:end;width:min(100%,470px)}
.hero-figure::after{content:"";position:absolute;inset:-14px -14px auto auto;width:62%;height:62%;border:1px solid var(--gold);border-radius:999px 999px 0 0;z-index:-1;opacity:.7}
@media (prefers-reduced-motion:no-preference){
  .hero h1,.hero .sub,.hero .ctas,.hero .facts{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
  .hero .sub{animation-delay:.12s}.hero .ctas{animation-delay:.22s}.hero .facts{animation-delay:.32s}
  .arch img{animation:settle 1.6s cubic-bezier(.2,.7,.2,1) both}
}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes settle{from{transform:scale(1.08)}to{transform:scale(1)}}
@media (max-width:820px){
  .hero .wrap{grid-template-columns:1fr;padding-block:1.6rem 2rem}
  .hero-figure{justify-self:stretch;width:100%}
  .arch{aspect-ratio:auto;height:min(52vh,420px);border-radius:200px 200px var(--radius) var(--radius)}
  .hero-figure::after{display:none}
  .hero .facts{margin-top:1.4rem}
}

/* sections */
.section{padding-block:clamp(3rem,7vw,6rem)}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap;margin-bottom:2rem}
.section-head h2{font-size:clamp(2rem,4vw,3.2rem)}
.section-head p{color:var(--muted);max-width:44ch}

/* categories */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.cat{position:relative;display:flex;flex-direction:column;justify-content:flex-end;aspect-ratio:3/4;border-radius:var(--radius);overflow:hidden;text-decoration:none;background:var(--blush);isolation:isolate}
.cat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
.cat:hover img{transform:scale(1.05)}
.cat .lbl{margin:.75rem;background:var(--surface);border-radius:12px;padding:.75rem 1rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.cat .lbl b{font-family:var(--f-display);font-size:1.35rem;font-weight:500}
.cat .lbl small{font-size:.78rem;color:var(--muted)}
.cat.empty{background:var(--blush-2);border:1px dashed var(--line)}
.cat.empty .mark{position:absolute;inset:0;display:grid;place-items:center;z-index:-1}
.cat.empty .mark img{position:static;width:44%;height:auto;opacity:.55}
.cat .lbl small{white-space:nowrap}
@media (max-width:820px){.cats{grid-template-columns:repeat(2,1fr)}.cat .lbl{flex-direction:column;align-items:flex-start;gap:0;margin:.5rem;padding:.6rem .8rem}.cat .lbl b{font-size:1.15rem}}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(1rem,2vw,1.6rem)}
@media (max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:360px){.grid{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;gap:.7rem;min-width:0}
.card-img{position:relative;display:block;aspect-ratio:4/5;border-radius:var(--radius);overflow:hidden;background:linear-gradient(100deg,var(--blush-2) 30%,var(--blush) 50%,var(--blush-2) 70%);background-size:300% 100%;animation:shimmer 1.4s linear infinite}
.card-img.loaded{animation:none;background:var(--blush-2)}
.card-img img{width:100%;height:100%;object-fit:cover;object-position:50% 58%;transition:opacity .4s;opacity:0}
.card-img.loaded img{opacity:1}
@keyframes shimmer{to{background-position:-300% 0}}
@media (prefers-reduced-motion:reduce){.card-img{animation:none}}
.badge{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:600;padding:.25rem .6rem;border-radius:999px;background:var(--surface);color:var(--ink);letter-spacing:.02em}
.card-img .badge{position:absolute;top:.6rem;left:.6rem}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.bad{background:var(--bad-bg);color:var(--bad)}.badge.info{background:var(--info-bg);color:var(--info)}.badge.demo{background:var(--demo-bg);color:var(--demo)}
.card-ref{font-size:.72rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.card h3{font-family:var(--f-body);font-size:.98rem;font-weight:600;line-height:1.35}
.card h3 a{text-decoration:none}
.card .meta{font-size:.82rem;color:var(--muted)}
.card .price{font-family:var(--f-display);font-size:1.25rem}
.card .price.tbd{font-family:var(--f-body);font-size:.88rem;color:var(--muted);font-style:italic}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;flex-wrap:wrap}
.card .btn{width:100%}
.swatch{display:inline-block;width:12px;height:12px;border-radius:50%;border:1px solid var(--line);vertical-align:-1px;margin-right:.3rem}

/* sets band */
.band{background:var(--blush)}
.sets{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:.75rem;scrollbar-width:thin}
.set{scroll-snap-align:start;text-decoration:none;display:flex;flex-direction:column;gap:.6rem}
.set .ph{aspect-ratio:3/4;border-radius:999px 999px var(--radius) var(--radius);overflow:hidden;background:var(--blush-2)}
.set img{width:100%;height:100%;object-fit:cover;object-position:50% 62%;transition:transform .8s}
.set:hover img{transform:scale(1.05)}
.set span{font-size:.9rem;font-weight:500}

/* split */
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.5rem,5vw,5rem);align-items:center}
.split .ph{border-radius:var(--radius);overflow:hidden;aspect-ratio:4/5;background:var(--blush-2)}
.split .ph img{width:100%;height:100%;object-fit:cover}
.split h2{font-size:clamp(2rem,4vw,3.2rem);margin:.6rem 0 1rem}
.split p{color:var(--muted);max-width:46ch}
.split .actions{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1.6rem}
@media (max-width:820px){.split{grid-template-columns:1fr}.split .ph{aspect-ratio:4/4.4}}
.placeholder{border:1px dashed var(--rose);border-radius:var(--radius);aspect-ratio:4/5;display:grid;place-items:center;text-align:center;padding:2rem;color:var(--muted);background:var(--blush-2);font-size:.9rem}
.placeholder img{width:90px;margin:0 auto 1rem;opacity:.7}

/* help band */
.help{background:var(--rose-deep);color:var(--btn-fg)}
.help .wrap{display:flex;justify-content:space-between;align-items:center;gap:1.5rem;flex-wrap:wrap;padding-block:clamp(2.5rem,5vw,4rem)}
.help h2{font-size:clamp(1.8rem,3.4vw,2.8rem);max-width:20ch}
.help h2 em{color:inherit;opacity:.8}
.help .num{font-size:.9rem;opacity:.9;margin-top:.6rem}
.help .btn-wa{background:var(--btn-fg);color:var(--rose-deep)}

/* footer */
footer{border-top:1px solid var(--line);background:var(--blush-2)}
.foot{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:2rem;padding-block:3.5rem 2rem}
.foot h4{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;margin:0 0 .9rem;color:var(--muted)}
.foot ul{list-style:none;margin:0;padding:0;display:grid;gap:.45rem;font-size:.92rem}
.foot a{text-decoration:none}.foot a:hover{text-decoration:underline}
.foot .logo img{height:58px}
.foot .about{font-size:.9rem;color:var(--muted);margin-top:1rem;max-width:32ch}
.legal{border-top:1px solid var(--line);padding-block:1.2rem;font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.pay-tag{display:inline-flex;gap:.4rem;align-items:center;border:1px solid var(--line);border-radius:6px;padding:.15rem .5rem;font-size:.78rem;font-weight:600;background:var(--surface)}
@media (max-width:820px){.foot{grid-template-columns:1fr 1fr}.foot>div:first-child{grid-column:1/-1}}

/* page head + breadcrumbs */
.page-head{padding-block:2.2rem 1.2rem}
.page-head h1{font-size:clamp(2.2rem,5vw,3.8rem)}
.page-head p{color:var(--muted);margin-top:.6rem;max-width:56ch}
.crumbs{font-size:.82rem;color:var(--muted);display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem}
.crumbs a{text-decoration:none}.crumbs a:hover{text-decoration:underline}

/* shop */
.shop{display:grid;grid-template-columns:240px minmax(0,1fr);gap:2.5rem;padding-bottom:5rem}
.filters{display:grid;gap:1.4rem;align-content:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 90px)}
.filters fieldset{border:0;padding:0;margin:0;display:grid;gap:.4rem}
.filters legend{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--muted);margin-bottom:.5rem}
.chk{display:flex;align-items:center;gap:.55rem;font-size:.92rem;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--rose-deep)}
.chk small{color:var(--muted)}
.toolbar{display:flex;gap:.75rem;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:1.4rem}
.input,select.input,textarea.input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:.55rem .85rem;font-size:.95rem}

/* product page */
.pdp{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(1.5rem,5vw,4.5rem);padding-bottom:4rem;align-items:start}
.gallery{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px)}
.zoom{position:relative;border-radius:var(--radius);overflow:hidden;aspect-ratio:4/5;background:var(--blush-2);cursor:zoom-in}

.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.qty button{width:42px;height:44px;border:0;background:none;cursor:pointer;font-size:1.1rem}

.buy-row{display:flex;gap:.75rem;margin-top:1.4rem;flex-wrap:wrap}

.details{margin-top:2rem;border-top:1px solid var(--line)}
.details dl{display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:.55rem 1.2rem;margin:1.2rem 0;font-size:.92rem}

.details dd{margin:0}
.tbd-txt{color:var(--muted);font-style:italic}
.note{font-size:.85rem;color:var(--muted);background:var(--blush-2);border-radius:10px;padding:.8rem 1rem}
.sticky-buy{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:.6rem var(--gut-r) calc(.6rem + env(safe-area-inset-bottom,0px)) var(--gut-l);display:none;gap:.75rem;align-items:center;justify-content:space-between;box-shadow:0 -10px 30px -20px rgba(0,0,0,.4)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(27,16,21,.45);z-index:90;opacity:0;transition:opacity .25s}
.scrim.open{opacity:1}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--bg);z-index:91;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .35s cubic-bezier(.2,.7,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}

.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:1rem 1.2rem;border-bottom:1px solid var(--line)}

.drawer-foot{border-top:1px solid var(--line);padding:1rem 1.2rem;display:grid;gap:.6rem}

.line img{width:72px;aspect-ratio:4/5;object-fit:cover;border-radius:10px}
.line .nm{font-weight:600;font-size:.92rem;line-height:1.3}

.line .tot{font-weight:600;font-size:.92rem}
.line .ctl{display:flex;gap:.6rem;align-items:center;margin-top:.45rem}
.line .qty button{width:34px;height:34px}
.line .qty input{width:30px;font-size:.9rem}
.sum{display:grid;gap:.4rem;font-size:.95rem}
.sum div{display:flex;justify-content:space-between;gap:1rem}
.sum .total{font-weight:700;font-size:1.1rem;border-top:1px solid var(--line);padding-top:.6rem;margin-top:.2rem}
.sum .muted{color:var(--muted);font-size:.85rem}

/* cart page + checkout */
.two{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:2.5rem;align-items:start;padding-bottom:5rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.4rem}

.lines{display:grid;gap:1.2rem}
.steps{display:flex;gap:.5rem;list-style:none;padding:0;margin:0 0 1.6rem;flex-wrap:wrap}

.check{display:flex;gap:.6rem;align-items:flex-start;font-size:.9rem}

.review dl{display:grid;grid-template-columns:auto 1fr;gap:.35rem 1rem;font-size:.92rem;margin:0}

.callout.info{background:var(--info-bg);color:var(--info)}
.callout.demo{background:var(--demo-bg);color:var(--demo)}
.callout.ok{background:var(--ok-bg);color:var(--ok)}
.callout.bad{background:var(--bad-bg);color:var(--bad)}

/* order page */
.status-row{display:flex;gap:.6rem;flex-wrap:wrap;margin:.8rem 0 0}
.mbway{display:grid;gap:1rem;justify-items:start}
.timer{font-family:var(--f-display);font-size:2.6rem;line-height:1}

@keyframes pulse{50%{opacity:.3}}
.sim{display:flex;gap:.5rem;flex-wrap:wrap}
pre.summary{white-space:pre-wrap;font-family:var(--f-body);font-size:.88rem;background:var(--blush-2);border-radius:10px;padding:1rem;margin:0;max-height:300px;overflow:auto}

/* text pages */
.prose{max-width:68ch;padding-bottom:5rem;display:grid;gap:1.1rem}

details.faq{border-bottom:1px solid var(--line);padding:1rem 0}

.copyrow{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.copyrow code{font-family:var(--f-body);font-weight:600;font-size:1.05rem;user-select:all}

/* search overlay */
.search-ov{position:fixed;inset:0;z-index:95;background:color-mix(in srgb,var(--bg) 97%,transparent);padding:calc(env(safe-area-inset-top,0px) + 1.2rem) var(--gut-r) 2rem var(--gut-l);overflow:auto}

.sres{display:grid;gap:.4rem}

.sres a:hover,.sres a:focus{background:var(--blush)}
.sres img{width:56px;height:70px;object-fit:cover;border-radius:8px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;background:var(--ink);color:var(--bg);padding:.75rem 1.2rem;border-radius:999px;font-size:.9rem;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* lightbox */
.lightbox{position:fixed;inset:0;z-index:110;background:rgba(15,10,12,.92);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 1rem) var(--gut-r) calc(env(safe-area-inset-bottom,0px) + 1rem) var(--gut-l)}

/* admin */
.admin-tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.4rem;border-bottom:1px solid var(--line);padding-bottom:.8rem}
.admin-tabs button{border:0;background:none;padding:.5rem .9rem;border-radius:999px;cursor:pointer;font-weight:600;font-size:.9rem;color:var(--muted)}
.admin-tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table.tbl{border-collapse:collapse;width:100%;font-size:.88rem;min-width:820px}
.tbl th{text-align:left;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:.8rem .7rem;border-bottom:1px solid var(--line);background:var(--blush-2)}
.tbl td{padding:.6rem .7rem;border-bottom:1px solid var(--line);vertical-align:middle}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.4rem}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1rem}

.log{font-size:.8rem;color:var(--muted);display:grid;gap:.2rem;margin-top:.4rem}

/* joia + joia na modelo */
.card-media{position:relative}
.card-img .track{display:grid;width:100%;height:100%}
.card-img .slide{grid-area:1/1;margin:0;overflow:hidden;position:relative;width:100%;height:100%}
.card-img .slide+.slide{opacity:0;transition:opacity .55s ease}
.slide-tag{position:absolute;left:.6rem;bottom:.6rem;font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;font-weight:600;background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--ink);padding:.22rem .55rem;border-radius:999px;opacity:0;transition:opacity .3s}
.dots{display:none}
@media (hover:hover){.card:hover .card-img .slide+.slide{opacity:1}.card:hover .slide-tag{opacity:1}}
@media (hover:none){
  .card-img .track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .card-img .track::-webkit-scrollbar{display:none}
  .card-img .slide{flex:0 0 100%;scroll-snap-align:start}
  .card-img .slide+.slide{opacity:1}
  .slide-tag{opacity:1}
  .dots{display:flex;position:absolute;bottom:.85rem;right:.7rem;gap:4px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--surface);opacity:.75}
}
@media (prefers-reduced-motion:reduce){.card-img .slide+.slide,.slide-tag{transition:none}}
.fav{position:absolute;top:.5rem;right:.5rem;width:40px;height:40px;border-radius:50%;border:0;background:color-mix(in srgb,var(--surface) 90%,transparent);display:grid;place-items:center;cursor:pointer;z-index:2;color:var(--ink)}
.fav:hover{color:var(--rose-deep)}
[aria-pressed="true"] .heart{fill:currentColor}
.fav[aria-pressed="true"]{color:var(--rose-deep)}
.topbar .msg{transition:opacity .35s}
/* marquee */
.marquee{overflow:hidden;border-block:1px solid var(--line);padding-block:clamp(.8rem,2vw,1.4rem)}
.marquee-track{display:flex;gap:3rem;white-space:nowrap;font-family:var(--f-display);font-style:italic;font-size:clamp(2.4rem,7.5vw,6.5rem);line-height:1.1;color:var(--rose);will-change:transform}
.marquee-track span{display:inline-flex;align-items:center;gap:3rem}
.marquee-track span::after{content:"";width:.22em;height:.22em;transform:rotate(45deg);background:var(--gold);flex:none}
/* vitrine escura: a joia e a joia em ti */

.ink .btn-primary{background:var(--ink-accent);color:#2A161D}

.pair{display:grid;grid-template-columns:1fr 1fr;gap:clamp(.6rem,1.6vw,1.2rem);align-items:end}

.acc{margin-top:1.8rem;border-top:1px solid var(--line)}

/* página da peça, modelo editorial */
.crumbs{text-transform:uppercase;letter-spacing:.14em;font-size:.72rem}

.pdp .desc{margin-top:1.3rem;font-size:1.08rem;line-height:1.65;max-width:44ch}

.btn-sq{border-radius:4px;text-transform:uppercase;letter-spacing:.16em;font-size:.82rem;min-height:56px;padding:0 1rem}

/* transição suave entre páginas */
#veil{position:fixed;inset:0;z-index:70;pointer-events:none;background:linear-gradient(135deg,#E3BFC3 0%,#DD7A83 100%);opacity:0;transition:opacity .25s ease}
#veil.on{opacity:.7}
#app.enter{animation:pageIn .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#veil{display:none}#app.enter{animation:none}}
/* degradê suave entre secções: sem cortes secos */
.alt,.feature.alt{background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.26) 120px,rgba(255,255,255,.22) calc(100% - 120px),rgba(255,255,255,0) 100%)}
.trust{position:relative;overflow:visible}
.dhero{position:relative}
.dhero .copy{background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.2) 30%,rgba(255,255,255,.12) 100%)}
.dhero .media::after{content:"";position:absolute;top:0;bottom:0;right:0;width:22%;background:linear-gradient(90deg,rgba(227,191,195,0),rgba(227,191,195,.55));pointer-events:none}
.site-header{border-bottom:0;box-shadow:0 14px 26px -18px rgba(90,30,40,.35)}
footer{background:linear-gradient(180deg,rgba(255,246,247,0) 0%,rgba(255,246,247,.55) 140px,rgba(255,246,247,.6) 100%);border-top:0}
.wm-wrap{padding-block:1rem 2.4rem;text-align:center}
.wm{width:min(60%,320px);height:auto;margin:0 auto;opacity:.22}
.site-header .hdr-actions,.site-header .hdr-left{gap:0}
.site-header .icon-btn{width:36px;height:40px}
@media (max-width:820px){.dhero .media::after{top:auto;left:0;width:auto;height:30%;background:linear-gradient(180deg,rgba(227,191,195,0),rgba(227,191,195,.6))}}

/* categorias em esteira contínua */
.cat-belt{overflow:hidden;margin-inline:calc(-1 * var(--gut-l)) calc(-1 * var(--gut-r));-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.cat-track{display:flex;gap:16px;width:max-content;animation:catBelt 38s linear infinite;padding-block:2px}
.cat-belt:hover .cat-track,.cat-belt:focus-within .cat-track{animation-play-state:paused}
@keyframes catBelt{to{transform:translateX(calc(-100% / 3))}}
.cat-track,.trust .belt-track{animation-direction:reverse}
.cat-track{animation:none!important;will-change:transform}
.cat-belt{cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.cat-belt.dragging{cursor:grabbing}
.cat-belt.dragging .dcat-w{pointer-events:none}
.cat-belt img{-webkit-user-drag:none;user-drag:none;pointer-events:none}
.dcat-w{position:relative;flex:none;width:clamp(200px,21vw,290px)}
.dcat-w .dcat{width:100%}
.dcat .t{transition:transform .3s ease}
.dcat-w .hover-cta{left:.7rem;right:.7rem;bottom:.7rem}
@media (hover:hover){.dcat-w:hover .hover-cta{opacity:1;transform:none;pointer-events:auto}.dcat-w:hover .dcat .t{transform:translateY(-58px)}}
@media (max-width:820px){.dcat-w{width:58vw}.dcats .dcat:last-child{grid-column:auto;aspect-ratio:2/3}}


/* telemóvel: caixinha "Adicionar à seleção" sempre visível */
@media (hover:none){
  .hover-cta{display:flex;opacity:1;transform:none;pointer-events:auto;position:static;width:100%;min-height:30px;margin-top:.45rem;font-size:.55rem;letter-spacing:.08em;gap:.35rem;padding:0 .4rem}
  .hover-cta svg{width:12px;height:12px}
  .card .quick{display:none}
  .card .slide-tag{top:.55rem;bottom:auto;left:.55rem;font-size:.58rem}
  .dcat-w .hover-cta{min-height:32px;font-size:.58rem}
  .dcat-w .dcat .t{transform:none}
}

/* área de compras */
.paytags{display:flex;gap:.35rem;flex-wrap:wrap;margin-top:.6rem}
.paytags .pay-tag{font-size:.68rem;letter-spacing:.04em;background:#FFF6F7;border-color:rgba(58,31,38,.15);color:var(--ink)}
.pre-tag{display:inline-block;margin-top:.3rem;font-size:.72rem;font-weight:600;color:var(--rose-deep);background:rgba(255,255,255,.55);border-radius:4px;padding:.15rem .45rem}
.dinfo{background:rgba(255,255,255,.4);border-radius:10px;padding:1rem 1.1rem;display:grid;gap:.6rem;font-size:.9rem}
.dinfo ul{list-style:none;margin:0;padding:0;display:grid;gap:.4rem}
.dinfo li{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;border-bottom:1px dashed rgba(58,31,38,.15);padding-bottom:.35rem}
.dinfo small{color:var(--muted)}
.paym-wrap{border:0;margin:0;padding:0;display:grid;gap:.6rem}
.paym-wrap legend{font-size:1rem;font-weight:700;margin-bottom:.6rem}
.paym{display:grid;grid-template-columns:auto auto minmax(0,1fr);align-items:center;gap:.9rem;background:#FFF6F7;border:1px solid rgba(58,31,38,.15);border-radius:10px;padding:.85rem 1rem;cursor:pointer}
.paym input{width:18px;height:18px;accent-color:var(--rose-deep)}
.paym.on{border-color:var(--rose-deep);box-shadow:inset 0 0 0 1px var(--rose-deep)}
.pm-txt{display:grid;gap:.1rem;min-width:0}.pm-txt small{color:var(--muted);font-size:.8rem}
.pm-logo{min-width:74px;text-align:center;font-size:.66rem;font-weight:800;letter-spacing:.04em;border-radius:6px;padding:.45rem .5rem;color:#fff;white-space:nowrap}
.pm-mbway{background:#D40000}.pm-card{background:#1A1F71}.pm-klarna{background:#FFB3C7;color:#17120F}.pm-multibanco{background:#1E5BB8}
.pm-detail{font-size:.9rem;color:var(--ink);background:rgba(255,255,255,.4);border-radius:10px;padding:.9rem 1rem;display:grid;gap:.6rem}
.mbref{border-collapse:collapse;font-size:1.05rem;background:#FFF6F7;border-radius:10px;overflow:hidden}
.mbref th{text-align:left;font-weight:500;color:var(--muted);padding:.55rem 1rem;font-size:.85rem}
.mbref td{padding:.55rem 1rem;font-weight:700;letter-spacing:.04em}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:0}
.tl li{display:grid;grid-template-columns:22px 1fr;gap:.8rem;position:relative;padding-bottom:1.1rem;color:var(--muted)}
.tl li:last-child{padding-bottom:0}
.tl li i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(58,31,38,.25);background:#FFF6F7;margin-top:.25rem;position:relative;z-index:1}
.tl li:not(:last-child)::before{content:"";position:absolute;left:6px;top:1.1rem;bottom:0;width:2px;background:rgba(58,31,38,.15)}
.tl li.done{color:var(--ink)}.tl li.done i{background:var(--rose-deep);border-color:var(--rose-deep)}
.tl li.done:not(:last-child)::before{background:var(--rose-deep)}
.tl li.cur b{color:var(--rose-deep)}
.tl small{display:block;font-size:.8rem;color:var(--muted)}
.ord-card{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;text-decoration:none}
.ord-card small{display:block;color:var(--muted);font-size:.82rem;margin-top:.2rem}
.ord-badges{display:flex;gap:.4rem;flex-wrap:wrap}
.oos{display:grid;gap:.8rem;background:rgba(255,255,255,.4);border-radius:10px;padding:1rem}
.oos p{font-size:.92rem}
.oos-btns{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media (max-width:480px){.oos-btns{grid-template-columns:1fr}}
.restock{display:grid;gap:.8rem}
.restock .err{color:var(--bad);font-size:.82rem;font-weight:600}
.callout span{display:block}

/* ===== hero carrossel ===== */
.hs{position:relative;overflow:hidden;background:#E3BFC3;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.hs-track{display:flex;will-change:transform;cursor:grab}
.hs.dragging .hs-track{cursor:grabbing}
.hs-slide{position:relative;flex:0 0 100%;height:clamp(460px,min(78vh,52vw),760px);overflow:hidden}
.hs-media{position:absolute;inset:0}
.hs-media video,.hs-media img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.hs-slide::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none}
.hs-slide.side-l::before{background:linear-gradient(90deg,rgba(246,226,228,.92) 0%,rgba(246,226,228,.72) 30%,rgba(246,226,228,0) 52%)}
.hs-slide.side-r::before{background:linear-gradient(270deg,rgba(246,226,228,.95) 0%,rgba(246,226,228,.85) 30%,rgba(246,226,228,.4) 42%,rgba(246,226,228,0) 55%)}
@media (min-width:821px){.side-r .hs-copy{width:min(31vw,460px)}}
.hs-copy{position:absolute;z-index:2;top:50%;transform:translateY(-50%);width:min(36vw,500px);display:grid;gap:1rem;justify-items:start;color:var(--ink)}
.side-l .hs-copy{left:max(5vw,var(--gut-l))}
.side-r .hs-copy{right:max(5vw,var(--gut-r))}
.hs-copy .eyebrow{color:var(--ink);letter-spacing:.32em}
.hs-copy h2{font-size:clamp(2.6rem,4.6vw,4.8rem);line-height:.98;font-weight:500}
.hs-sub{font-size:clamp(1rem,1.25vw,1.15rem);color:#4A2F37;max-width:32ch}
.hs-facts{list-style:none;margin:.4rem 0 0;padding:.9rem 0 0;border-top:1px solid rgba(58,31,38,.2);display:grid;gap:.45rem;font-size:.85rem}
.hs-facts li{display:flex;gap:.6rem;align-items:center}
.hs-facts svg{width:20px;height:20px;color:var(--rose-deep);flex:none}
.hs-bars{position:absolute;z-index:3;left:50%;bottom:1.1rem;transform:translateX(-50%);display:flex;gap:.5rem}
.hs-bars button{background:none;border:0;padding:.6rem 0;cursor:pointer}
.hs-bars i{display:block;width:34px;height:3px;border-radius:2px;background:rgba(255,255,255,.75);transition:width .3s,background .3s}
.hs-bars button.on i{width:58px;background:var(--rose-deep)}
@media (prefers-reduced-motion:no-preference){.hs-slide .hs-copy>*{transition:opacity .6s ease .25s,transform .6s ease .25s}}
@media (max-width:820px){

  .hs-copy{position:relative;top:auto;left:auto!important;right:auto!important;transform:none;width:auto;padding:1.2rem var(--gut-r) 3.4rem var(--gut-l);gap:.8rem}

}

@media (max-width:820px){

function getCart(){return LS.get(key("cart"),[])}
function setCart(c){LS.set(key("cart"),c);updateCount()}
function orderable(p){return !!p&&!(p.stock!=null&&p.avail<=0)}
function maxQty(p){return p.avail!=null&&p.stock!=null?p.avail:20}
function cartLines(){
  const cat=catalog(),out=[],notes=[];
  for(const l of getCart()){
    const p=cat.find(x=>x.id===l.id);if(!p)continue;
    const v=p.variants.find(x=>x.id===l.v)||p.variants[0];
    if(!orderable(p)&&!l.pre){notes.push(`${p.name} esgotou e saiu do carrinho.`);continue}
    const qty=Math.min(l.qty,l.pre?5:maxQty(p));
    if(qty<l.qty)notes.push(`A quantidade de ${p.name} foi ajustada ao stock disponível.`);
    out.push({p,v,qty,pre:!!l.pre,total:p.price!=null?p.price*qty:null});
  }
  const unknown=out.some(l=>l.total==null);
  return {lines:out,notes,unknown,subtotal:out.reduce((a,l)=>a+(l.total||0),0),count:out.reduce((a,l)=>a+l.qty,0)};
}
function normalizeCart(){const c=cartLines();setCart(c.lines.map(l=>({id:l.p.id,v:l.v.id,qty:l.qty,pre:l.pre||undefined})));return c}
function addToCart(id,vid,qty,pre){
  const p=byId(id);if(!p)return false;
  if(!pre&&!orderable(p)){toast("Esta peça está esgotada. Podes fazer uma encomenda ou pedir aviso de reposição.");return false}
  const c=getCart();const ex=c.find(l=>l.id===id&&l.v===vid);
  if(ex&&pre)ex.pre=true;
  const cur=ex?ex.qty:0;const n=Math.min(pre?5:maxQty(p),cur+qty);
  if(n===cur){toast("Já tens no carrinho a quantidade máxima desta peça.");return false}
  if(ex)ex.qty=n;else c.push(pre?{id,v:vid,qty:n,pre:true}:{id,v:vid,qty:n});
  setCart(c);track("add_to_cart",{ref:p.ref,qty:n-cur});
  return true;
}

/* ============ "SERVIDOR" DA PRÉVIA ============
   Na prévia, encomendas e pagamentos ficam neste navegador para se poder testar o percurso.
   Em produção, estas funções são substituídas por chamadas à API (ver separador Integrações no painel). */
const Server={
  orders(){return LS.get(key("srv_orders"),{})},
  save(o){const all=this.orders();all[o.ref]=o;LS.set(key("srv_orders"),all)},
  get(ref){return this.orders()[ref]||null},
  zoneFromCP(cp){const n=parseInt(cp.slice(0,2),10);if(n>=90&&n<=93)return"madeira";if(n>=95&&n<=99)return"acores";return"continente"},
  quote(lines,zone){
    // recálculo do lado do "servidor": preços e stock vêm do catálogo, nunca do navegador
    const cat=catalog();let subtotal=0;const items=[];
    for(const l of lines){
      const p=cat.find(x=>x.id===l.id);
      if(!p)throw new Error("Uma peça já não está disponível.");
      if(p.price==null)throw new Error(`O preço de ${p.name} ainda não está definido.`);
      if(l.pre){if(mode!=="demo"&&p.status!=="publicado")throw new Error(`${p.name} ainda não está à venda online.`)}
      else{if(!purchasable(p))throw new Error(`${p.name} já não está disponível.`);if(p.stock!=null&&l.qty>p.avail)throw new Error(`Só há ${p.avail} unidade(s) de ${p.name}.`)}
      const v=p.variants.find(x=>x.id===l.v)||p.variants[0];
      items.push({id:p.id,ref:p.ref,name:p.name,variant:variantLabel(v),img:p.img,qty:l.qty,unit:p.price,total:p.price*l.qty,pre:!!l.pre});
      subtotal+=p.price*l.qty;
    }
    const z=shippingCfg()[zone];const shipping=z&&z.price!=null?z.price:null;
    return {items,subtotal,shipping,total:shipping==null?null:subtotal+shipping};
  },
  createOrder(token,customer,lines){
    const all=this.orders();
    const dup=Object.values(all).find(o=>o.token===token);
    if(dup)return dup; // proteção contra duplo clique / recarregamento
    const zone=customer.zoneEU?"europa":this.zoneFromCP(customer.cp);
    const q=this.quote(lines,zone);
    const d=new Date();const ymd=d.toISOString().slice(2,10).replace(/-/g,"");
    const rnd=Array.from(crypto.getRandomValues(new Uint8Array(4))).map(b=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[b%32]).join("");
    const o={ref:"VT"+ymd+"-"+rnd,token,mode,createdAt:Date.now(),customer,zone,items:q.items,subtotal:q.subtotal,shipping:q.shipping,total:q.total,
      payment:{status:"por_iniciar",method:customer.pay||"mbway",attempts:[]},fulfillment:"nova",tracking:"",notifications:[],log:[{t:Date.now(),m:"Encomenda criada"}]};
    // reserva de stock com prazo
    const res=LS.get(key("srv_res"),[]).filter(r=>r.exp>Date.now());
    q.items.filter(i=>!i.pre).forEach(i=>res.push({pid:i.id,qty:i.qty,ref:o.ref,exp:Date.now()+RESERVE_WINDOW}));
    LS.set(key("srv_res"),res);
    this.save(o);
    const mine=LS.get(key("my_orders"),[]);if(!mine.includes(o.ref)){mine.unshift(o.ref);LS.set(key("my_orders"),mine.slice(0,20))}
    return o;
  },
  release(ref){LS.set(key("srv_res"),LS.get(key("srv_res"),[]).filter(r=>r.ref!==ref))},
  commitStock(o){
    if(mode!=="demo")return; // no modo real o stock é gerido no painel/servidor
    // em demo, o stock confirmado é refletido apenas em memória de teste
    const adj=LS.get(key("srv_stockadj"),{});o.items.filter(i=>!i.pre).forEach(i=>adj[i.id]=(adj[i.id]||0)+i.qty);LS.set(key("srv_stockadj"),adj);
  },
  startMbway(ref,phone){return this.startPayment(ref,"mbway",{phone})},
  startPayment(ref,method,data){
    data=data||{};
    const o=this.get(ref);if(!o)throw new Error("Encomenda não encontrada.");
    if(o.payment.status==="confirmado")return o;
    if(o.total==null)throw new Error("Os portes desta zona ainda não estão confirmados.");
    if(!payMethods().includes(method))throw new Error("Este método de pagamento não está disponível.");
    o.payment.method=method;
    if(mode!=="demo"){o.log.push({t:Date.now(),m:`Pagamento ${PM[method].label}: ligação ao prestador por ativar`});this.save(o);throw new Error("Os pagamentos online estão a ser ativados. A tua encomenda ficou registada e a Vitrinii vai contactar-te para concluir o pagamento.")}
    const cur=o.payment.attempts.find(a=>a.status==="pendente"&&a.method===method&&a.exp>Date.now());
    if(cur){o.payment.status="pendente";this.save(o);return o}
    o.payment.attempts.forEach(a=>{if(a.status==="pendente")a.status="expirado"});
    const res=LS.get(key("srv_res"),[]).filter(r=>r.ref!==ref);o.items.filter(i=>!i.pre).forEach(i=>res.push({pid:i.id,qty:i.qty,ref,exp:Date.now()+Math.max(RESERVE_WINDOW,PAY_WINDOW[method])}));LS.set(key("srv_res"),res);
    const id="TX"+Date.now().toString(36).toUpperCase();
    const at={id,method,status:"pendente",start:Date.now(),exp:Date.now()+PAY_WINDOW[method]};
    if(method==="mbway")at.phone="9•• ••• "+String(data.phone||"").slice(-3);
    if(method==="multibanco"){at.entity="21 312";const r=String(Math.floor(1e8+Math.random()*9e8));at.mbref=r.slice(0,3)+" "+r.slice(3,6)+" "+r.slice(6,9)}
    o.payment.attempts.push(at);o.payment.status="pendente";
    o.log.push({t:Date.now(),m:`Pagamento ${PM[method].label} iniciado (teste) · ${id}`});
    this.save(o);return o;
  },
  // Notificação do prestador (em produção: webhook autenticado + consulta de estado)
  notify(ref,notifId,status){
    const o=this.get(ref);if(!o)return null;
    if(o.notifications.includes(notifId)){o.log.push({t:Date.now(),m:`Notificação ${notifId} repetida: ignorada`});this.save(o);return o}
    o.notifications.push(notifId);
    const a=o.payment.attempts[o.payment.attempts.length-1];
    if(!a||a.status!=="pendente"){o.log.push({t:Date.now(),m:`Notificação ${notifId} sem pagamento pendente: ignorada`});this.save(o);return o}
    a.status=status;o.payment.status=status;o.log.push({t:Date.now(),m:`Estado verificado: ${PAY[status][0]}`});
    if(status==="confirmado"){this.commitStock(o);this.release(ref)}
    this.save(o);return o;
  },
  checkExpiry(ref){
    const o=this.get(ref);if(!o)return null;
    const a=o.payment.attempts[o.payment.attempts.length-1];
    if(a&&a.status==="pendente"&&Date.now()>a.exp)return this.notify(ref,"EXP-"+a.id,"expirado");
    return o;
  }
};

const HS={el:null,i:1,timer:null,drag:false,sx:0,dx:0,w:0,hover:false,moved:false,anim:false};
function hsSet(i,animate){const t=HS.el;if(!t)return;HS.i=i;t.style.transition=animate?"transform .75s cubic-bezier(.65,.05,.25,1)":"none";t.style.transform=`translateX(${-i*100}%)`;HS.anim=animate;hsMedia()}
function hsReal(){const n=HERO.length;return ((HS.i-1)%n+n)%n}
function hsMedia(){
  const r=hsReal();document.querySelectorAll(".hs-bars button").forEach((b,k)=>{b.setAttribute("aria-selected",k===r);b.classList.toggle("on",k===r)});
  if(!HS.el)return;[...HS.el.children].forEach((sl,idx)=>{const v=sl.querySelector("video");if(!v)return;if(idx===HS.i){if(v.preload==="none")v.preload="auto";try{v.currentTime=0}catch(_){}const pr=v.play();if(pr&&pr.catch)pr.catch(()=>{})}else v.pause()});
  hsSchedule();
}
function hsFit(){const box=HS.el&&HS.el.parentNode;if(!box)return;if(matchMedia("(max-width:820px)").matches){const sl=HS.el.children[HS.i];if(sl)box.style.height=sl.offsetHeight+"px"}else box.style.height=""}
window.addEventListener("resize",hsFit);
function hsSchedule(){hsFit();clearTimeout(HS.timer);if(!HS.el||matchMedia("(prefers-reduced-motion: reduce)").matches)return;const h=HERO[hsReal()];HS.timer=setTimeout(()=>{if(HS.hover||HS.drag||document.hidden){hsSchedule();return}hsNext(1)},h.media?8000:6000)}
function hsNext(d){hsSet(HS.i+d,true)}
function hsFix(){const n=HERO.length;if(HS.i===0)hsSet(n,false);else if(HS.i===n+1)hsSet(1,false)}
function initHero(){
  const t=document.getElementById("hsTrack");clearTimeout(HS.timer);HS.el=t;if(!t)return;
  const box=t.parentNode;hsSet(1,false);
  t.addEventListener("transitionend",e=>{if(e.target===t)hsFix()});
  box.addEventListener("pointerenter",e=>{if(e.pointerType==="mouse")HS.hover=true});
  box.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse")HS.hover=false});
  t.addEventListener("pointerdown",e=>{if(e.button!==0)return;hsFix();HS.drag=true;HS.moved=false;HS.sx=e.clientX;HS.dx=0;HS.w=t.getBoundingClientRect().width;HS.pid=e.pointerId});
  t.addEventListener("pointermove",e=>{if(!HS.drag)return;HS.dx=e.clientX-HS.sx;if(!HS.moved&&Math.abs(HS.dx)>8){HS.moved=true;box.classList.add("dragging");try{t.setPointerCapture(HS.pid)}catch(_){}}if(HS.moved){t.style.transition="none";t.style.transform=`translateX(calc(${-HS.i*100}% + ${HS.dx}px))`}});
  const end=()=>{if(!HS.drag)return;HS.drag=false;box.classList.remove("dragging");if(HS.moved){const th=Math.min(120,HS.w*.18);if(HS.dx<-th)hsNext(1);else if(HS.dx>th)hsNext(-1);else hsSet(HS.i,true)}};
  t.addEventListener("pointerup",end);t.addEventListener("pointercancel",end);
  t.addEventListener("click",e=>{if(HS.moved){e.preventDefault();e.stopPropagation();HS.moved=false}},true);
  t.addEventListener("dragstart",e=>e.preventDefault());
  box.addEventListener("keydown",e=>{if(e.key==="ArrowRight")hsNext(1);if(e.key==="ArrowLeft")hsNext(-1)});
}

function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}

}
function renderResults(catId){

  if(!catId&&shopState.cats.length)list=list.filter(p=>shopState.cats.includes(p.cat));
  list=searchProducts(shopState.q,list);
  if(shopState.colors.length)list=list.filter(p=>p.variants.some(v=>shopState.colors.includes(v.color)));
  if(shopState.tones.length)list=list.filter(p=>p.variants.some(v=>shopState.tones.includes(v.tone)));
  if(shopState.styles.length)list=list.filter(p=>(p.styles||[]).some(t=>shopState.styles.includes(t)));
  if(shopState.avail)list=list.filter(p=>p.stock!=null&&p.avail>0);
  const mn=toCents(shopState.min),mx=toCents(shopState.max);
  if(mn!=null)list=list.filter(p=>p.price!=null&&p.price>=mn);
  if(mx!=null)list=list.filter(p=>p.price!=null&&p.price<=mx);
  const s=shopState.sort;
  if(s==="preco-asc")list.sort((a,b)=>(a.price??Infinity)-(b.price??Infinity));
  if(s==="preco-desc")list.sort((a,b)=>(b.price??-1)-(a.price??-1));
  if(s==="recentes")list.sort((a,b)=>(b.publishedAt||0)-(a.publishedAt||0));
  const all=catalog().filter(p=>!catId||p.cat===catId).length;
  $("#resultCount").textContent=list.length+(list.length===1?" peça":" peças");
  if(!all){res.innerHTML=`<div class="empty-state"><h3>Ainda não há peças nesta categoria</h3><p>As novidades são anunciadas primeiro no Instagram. Se procuras algo em particular, fala connosco.</p><div style="display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center"><a class="btn btn-primary btn-sm" href="#loja">Ver toda a coleção</a><a class="btn btn-soft btn-sm" href="${waLink("Olá, Vitrinii! Procuro uma peça que ainda não vi na loja.")}" target="_blank" rel="noopener">${ICON.wa} Perguntar no WhatsApp</a></div></div>`;return}

}

function waRef(){if(!wa.ref){const d=new Date();const ymd=d.toISOString().slice(2,10).replace(/-/g,"");const r=Array.from(crypto.getRandomValues(new Uint8Array(3))).map(b=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[b%32]).join("");wa.ref="VT"+ymd+"-"+r}return wa.ref}

  const tot=!c.unknown&&ship!=null?eur(c.subtotal+ship):"a confirmar";

Referência: ${waRef()}

${items}

Total de peças: ${c.count}
Valor dos artigos: ${sub}
Portes: ${ship!=null?eur(ship)+" ("+WZ[wa.zone]+")":"a confirmar ("+WZ[wa.zone]+")"}
Total: ${tot}

Nome: ${wa.name.trim()||"—"}${wa.phone.trim()?"\nTelemóvel: "+wa.phone.trim():""}
Entrega: ${wa.city.trim()||"—"}, ${WZ[wa.zone]}${wa.notes.trim()?"\nObservações: "+wa.notes.trim():""}

Podes confirmar a disponibilidade e como fazer o pagamento?`;
}
function waValid(){const e={};if(wa.name.trim().length<2)e.name="Indica o teu nome.";if(wa.city.trim().length<2)e.city="Indica a localidade de entrega.";wa.errors=e;return !Object.keys(e).length}
function waField(id,label,opts){opts=opts||{};const err=wa.errors[id];

let co={step:1,data:{name:"",email:"",phone:"",addr:"",cp:"",city:"",country:"PT",countryName:"",nif:"",notes:"",pay:"mbway",mbAlt:false,mbPhone:"",terms:false,mkt:false},errors:{},token:null};
function newToken(){return "CK-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,8)}
function validate(step){
  const d=co.data,e={};
  if(step===1){
    if(d.name.trim().length<3)e.name="Indica o teu nome completo.";
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email.trim()))e.email="Indica um e-mail válido, por exemplo nome@exemplo.pt.";
    if(!/^(\+351)?\s?9\d{2}\s?\d{3}\s?\d{3}$/.test(d.phone.replace(/\s/g,"").replace(/^00351/,"+351")))e.phone="Indica um telemóvel português com 9 dígitos, a começar por 9.";
  }
  if(step===2){
    if(d.addr.trim().length<5)e.addr="Indica a morada de entrega.";
    if(d.country==="PT"&&!/^\d{4}-\d{3}$/.test(d.cp.trim()))e.cp="Usa o formato 0000-000.";
    if(d.country==="EU"&&d.cp.trim().length<3)e.cp="Indica o código postal.";
    if(d.country==="EU"&&d.countryName.trim().length<3)e.countryName="Indica o país de entrega.";
    if(d.city.trim().length<2)e.city="Indica a localidade.";
    if(d.nif&&!/^\d{9}$/.test(d.nif.replace(/\s/g,"")))e.nif="O NIF tem 9 dígitos.";
  }
  if(step===3){

  return `<div class="field${err?" invalid":""}"><label for="f_${id}">${label}${opts.optional?' <span style="font-weight:400;color:var(--muted)">(opcional)</span>':""}</label>${input}${opts.hint?`<span class="hint" id="h_${id}">${opts.hint}</span>`:`<span id="h_${id}"></span>`}${err?`<span class="err" role="alert">${esc(err)}</span>`:""}</div>`;

function deliveryInfo(){const sh=shippingCfg();return `<div class="dinfo"><b>Entregas</b><ul>

function placeOrder(btn){
  if(btn.dataset.busy)return;btn.dataset.busy="1";btn.disabled=true;btn.textContent="A registar…";
  try{
    const c=normalizeCart();
    const d=co.data;
    const customer={name:d.name.trim(),email:d.email.trim(),phone:d.phone.trim(),addr:d.addr.trim(),cp:d.cp.trim(),city:d.city.trim(),country:d.country==="EU"?d.countryName.trim():"Portugal",zoneEU:d.country==="EU",pay:d.pay,nif:d.nif.trim(),notes:d.notes.trim(),mkt:d.mkt,mbPhone:(d.mbAlt?d.mbPhone:d.phone).replace(/\D/g,"").slice(-9)};
    let o=Server.createOrder(co.token,customer,c.lines.map(l=>({id:l.p.id,v:l.v.id,qty:l.qty,pre:l.pre})));
    // carrinho só é esvaziado depois de a encomenda existir no "servidor"
    setCart([]);
    if(o.total!=null){try{o=Server.startPayment(o.ref,customer.pay,{phone:customer.mbPhone})}catch(e){}}
    co={step:1,data:{name:"",email:"",phone:"",addr:"",cp:"",city:"",country:"PT",countryName:"",nif:"",notes:"",pay:"mbway",mbAlt:false,mbPhone:"",terms:false,mkt:false},errors:{},token:null};
    location.hash="encomenda-"+o.ref;
  }catch(e){btn.disabled=false;delete btn.dataset.busy;btn.textContent="Tentar novamente";toast(e.message)}
}

  const cur=st.reduce((a,x,i)=>x[1]?i:a,0);
  return `<ol class="tl">${st.map((x,i)=>`<li class="${x[1]?"done":""}${i===cur?" cur":""}"><i></i><div><b>${x[0]}</b>${x[2]?`<small>${x[2]}</small>`:""}</div></li>`).join("")}</ol>`;
}

function pagePrivacy(){

  <div class="wrap prose policy">
    <p>A Vitrinii respeita a tua privacidade. Esta política explica que dados pessoais recolhemos quando visitas a loja, guardas peças na tua seleção, falas connosco ou fazes uma encomenda, para que os usamos e quais são os teus direitos, nos termos do Regulamento Geral sobre a Proteção de Dados (RGPD) e da legislação portuguesa aplicável.</p>
    <h2>1. Responsável pelo tratamento</h2>
    <p>O responsável pelo tratamento dos teus dados é ${resp}, que opera a marca Vitrinii by Yara Lauer.</p>

    <h2>2. Que dados recolhemos</h2>
    <ul>
      <li><b>Dados de identificação e contacto:</b> nome, e-mail e número de telemóvel.</li>
      <li><b>Dados de entrega:</b> morada, código postal, localidade e país.</li>
      <li><b>Dados de faturação:</b> NIF, quando o indicas para a fatura.</li>
      <li><b>Dados da encomenda e do pagamento:</b> peças escolhidas, valores, referência da encomenda, número de telemóvel usado no MB WAY e estado do pagamento. Não temos acesso aos dados da tua conta bancária.</li>
      <li><b>Comunicações:</b> mensagens que nos envias pelo WhatsApp, Instagram ou e-mail, incluindo o resumo da tua seleção ou encomenda.</li>
      <li><b>Dados guardados no teu navegador:</b> o carrinho, a tua seleção, as peças vistas recentemente e a referência das encomendas feitas neste dispositivo.</li>
    </ul>
    <h2>3. Para que usamos os teus dados e com que fundamento</h2>
    <ul>
      <li><b>Processar e entregar a tua encomenda</b>, incluindo o pagamento, o envio e o apoio pós-venda. Fundamento: execução do contrato de compra.</li>
      <li><b>Responder aos teus pedidos</b> de informação, preço ou disponibilidade. Fundamento: diligências pré-contratuais a teu pedido.</li>
      <li><b>Emitir faturas e cumprir obrigações fiscais e contabilísticas.</b> Fundamento: cumprimento de obrigação legal.</li>

      <li><b>Prevenir fraude e garantir a segurança da loja.</b> Fundamento: interesse legítimo da Vitrinii.</li>
    </ul>
    <h2>4. Com quem partilhamos os dados</h2>
    <p>Só partilhamos os dados necessários com:</p>
    <ul>
      <li>o prestador de serviços de pagamento que processa o MB WAY;</li>
      <li>as transportadoras que fazem a entrega da encomenda;</li>
      <li>os prestadores de alojamento e manutenção do site;</li>
      <li>o serviço de contabilidade, para efeitos de faturação;</li>
      <li>as autoridades, quando a lei o exigir.</li>
    </ul>
    <p>Estes prestadores tratam os dados apenas segundo as nossas instruções. Não vendemos os teus dados.</p>
    <h2>5. WhatsApp e redes sociais</h2>
    <p>Quando nos contactas pelo WhatsApp ou pelo Instagram, a conversa é também tratada pela Meta Platforms, de acordo com as políticas de privacidade dessas plataformas. Alguns destes serviços podem transferir dados para fora do Espaço Económico Europeu, com as garantias previstas no RGPD. No resumo enviado pelo WhatsApp não incluímos a tua morada completa nem o teu NIF.</p>

/* ============ ROUTER ============ */
let currentRoute="inicio";
function route(){
  clearInterval(pollT);document.body.classList.remove("has-sticky");
  const h=(location.hash||"#inicio").slice(1)||"inicio";
  currentRoute=h;let html="";let after=null;
  if(h==="inicio")html=pageHome();
  else if(h==="loja"||CATS.some(c=>c.id===h)){const cid=h==="loja"?null:h;html=pageShop(cid);after=()=>{$("#shopSort").value=shopState.sort;renderResults(cid)}}
  else if(h.startsWith("p-")){html=pageProduct(h.slice(2));after=setupPdp}
  else if(h==="carrinho")html=pageCart();
  else if(h==="finalizar")html=sitePay()?pageCheckout():pageWaCheckout();
  else if(h==="whatsapp")html=pageWaCheckout();
  else if(h==="encomendas")html=pageTracking();
  else if(h.startsWith("encomenda-")){const ref=h.slice(10);html=pageOrder(ref);after=()=>{const o=Server.get(ref);if(o&&o.payment.status==="pendente")pollT=setInterval(()=>{const t=Server.checkExpiry(ref);if(!t)return;if(t.payment.status!=="pendente"){route();return}const a=t.payment.attempts[t.payment.attempts.length-1];const left=Math.max(0,a.exp-Date.now());const el=$("#timer");if(el)el.textContent=Math.floor(left/60000)+":"+String(Math.floor(left%60000/1000)).padStart(2,"0")},1000)}}
  else if(h==="selecao")html=pageSelection();
  else if(h==="cuidados")html=pageCare();
  else if(h==="sobre")html=pageAbout();
  else if(h==="contactos")html=pageContacts();
  else if(h==="envios")html=pageShipping();
  else if(["termos","privacidade","cookies"].includes(h))html=pageLegal(h);
  else if(h==="admin")html=pageAdmin();
  else html=pageHome();
  renderChrome(h);
  $("#app").innerHTML=html;
  if(after)after();
  initHero();
  markLoaded();
  window.scrollTo({top:0,behavior:"instant"});
  closeLayer();
}
function rerender(){const y=window.scrollY;route();window.scrollTo(0,y)}
function rerenderKeepFocus(){setTimeout(()=>{const id=document.activeElement&&document.activeElement.id;rerender();if(id){const el=document.getElementById(id);if(el)el.focus({preventScroll:true})}},0)}
function markLoaded(){document.querySelectorAll(".card-img img").forEach(i=>{if(i.complete&&i.naturalWidth)i.closest(".card-img").classList.add("loaded")})}
document.addEventListener("load",e=>{const i=e.target;if(i.tagName==="IMG"){const c=i.closest(".card-img");if(c)c.classList.add("loaded")}},true);
document.addEventListener("error",e=>{const i=e.target;if(i.tagName==="IMG"){const c=i.closest(".card-img");if(c)c.classList.add("loaded")}},true);
/* faixa de texto que desliza com a rolagem */
const RM=matchMedia("(prefers-reduced-motion: reduce)");let mqT=false;
window.addEventListener("scroll",()=>{if(mqT||RM.matches)return;mqT=true;requestAnimationFrame(()=>{mqT=false;const m=document.getElementById("mq");if(!m)return;const r=m.parentNode.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;m.style.transform="translateX("+(-(innerHeight-r.top)*0.45)+"px)"})},{passive:true});

function setupPdp(){
  const z=$("#zoom"),img=$("#pdpImg");if(z){
    const reset=()=>{z.classList.remove("on");img.setAttribute("style",img.dataset.base||"")};
    const at=e=>{const r=z.getBoundingClientRect();img.style.transformOrigin=((e.clientX-r.left)/r.width*100)+"% "+((e.clientY-r.top)/r.height*100)+"%";img.style.transform="scale(2.3)"};
    z.addEventListener("mousemove",e=>{if(z.classList.contains("on"))at(e)});
    z.addEventListener("click",e=>{if(matchMedia("(hover:hover)").matches){if(z.classList.contains("on"))reset();else{z.classList.add("on");at(e)}}else openLightbox(img.src,img.alt)});
    z.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openLightbox(img.src,img.alt)}});
    z.addEventListener("mouseleave",reset);
  }
  const sb=$("#stickyBuy");if(sb){document.body.classList.add("has-sticky");sb.classList.add("show")}
}

/* ============ CAMADAS (carrinho lateral, menu, pesquisa) ============ */
function closeLayer(){
  const l=$("#layer");const d=l.querySelector(".drawer");
  if(d){d.classList.remove("open");l.querySelector(".scrim").classList.remove("open");setTimeout(()=>{l.innerHTML=""},matchMedia("(prefers-reduced-motion:reduce)").matches?0:300)}else l.innerHTML="";
  document.body.style.overflow="";
}
function openDrawer(){
  const c=normalizeCart();
  $("#layer").innerHTML=`<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Carrinho">
    <div class="drawer-head"><h2>Carrinho</h2><button class="icon-btn" data-act="close" aria-label="Fechar carrinho">${ICON.close}</button></div>
    <div class="drawer-body">${c.notes.map(n=>`<div class="callout warn">${esc(n)}</div>`).join("")}${c.lines.length?c.lines.map(l=>lineHtml(l,true)).join(""):emptyCart()}</div>
    ${c.lines.length?`<div class="drawer-foot">${summaryHtml(c)}${checkoutCtas('<a class="btn btn-ghost btn-block" href="#carrinho">Ver carrinho completo</a>')}</div>`:""}
  </aside>`;
  document.body.style.overflow="hidden";
  requestAnimationFrame(()=>{$("#layer .drawer").classList.add("open");$("#layer .scrim").classList.add("open");$("#layer .drawer .icon-btn").focus()});
}
function refreshCartViews(){if(currentRoute==="finalizar"||currentRoute==="whatsapp"){rerender();return}if($("#layer .drawer")){const c=normalizeCart();const b=$("#layer .drawer-body");b.innerHTML=c.notes.map(n=>`<div class="callout warn">${esc(n)}</div>`).join("")+(c.lines.length?c.lines.map(l=>lineHtml(l,true)).join(""):emptyCart());const f=$("#layer .drawer-foot");if(f){if(c.lines.length)f.firstElementChild.outerHTML=summaryHtml(c);else f.remove()}}if(currentRoute==="carrinho")rerender()}
function openMenu(){
  $("#layer").innerHTML=`<nav class="mobile-nav" aria-label="Menu"><button class="icon-btn close" data-act="close" aria-label="Fechar menu">${ICON.close}</button>
  ${[["inicio","Início"],["loja","Loja"],...CATS.map(c=>[c.id,c.label]),["sobre","Sobre"],["contactos","Contactos"],["envios","Envios"],["cuidados","Cuidados"],["selecao","A minha seleção"],["carrinho","Carrinho"],["encomendas","As minhas encomendas"]].map(([h,l])=>`<a href="#${h}">${l}</a>`).join("")}</nav>`;
  document.body.style.overflow="hidden";$("#layer .close").focus();
}
function openSearch(){
  $("#layer").innerHTML=`<div class="search-ov" role="dialog" aria-modal="true" aria-label="Pesquisar"><div class="inner">
    <div class="bar"><label class="sr" for="ovSearch">Pesquisar peças</label><input id="ovSearch" class="input" type="search" placeholder="Pesquisa por nome, categoria ou referência" autocomplete="off"><button class="icon-btn" data-act="close" aria-label="Fechar pesquisa">${ICON.close}</button></div>
    <div class="sres" id="ovRes"></div></div></div>`;
  document.body.style.overflow="hidden";
  const inp=$("#ovSearch");inp.focus();
  const run=()=>{const r=searchProducts(inp.value,catalog());$("#ovRes").innerHTML=!inp.value.trim()?`<p style="color:var(--muted)">Experimenta “verde”, “argolas”, “prateado” ou “VT-003”.</p>`:r.length?r.map(p=>`<a href="#p-${p.slug}"><img src="${p.img}" alt=""><span><b>${esc(p.name)}</b><br><small style="color:var(--muted)">${esc(p.ref)}</small></span>${priceHtml(p,"tab")}</a>`).join(""):`<p>Nenhuma peça encontrada para “${esc(inp.value)}”.</p>`};
  inp.addEventListener("input",run);run();
