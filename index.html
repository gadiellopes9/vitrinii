function openLightbox(src,alt){$("#layer").innerHTML=`<div class="lightbox" role="dialog" aria-modal="true" aria-label="Fotografia ampliada" data-act="close"><img src="${src}" alt="${esc(alt)}"><button class="btn btn-sm" data-act="close">Fechar</button></div>`;document.body.style.overflow="hidden"}

/* ============ EVENTOS ============ */
document.addEventListener("click",e=>{
  const ln=e.target.closest('#layer a[href^="#"]');if(ln&&ln.getAttribute("href")===(location.hash||"#inicio"))closeLayer();
  const t=e.target.closest("[data-act],[data-track]");if(!t)return;
  if(t.dataset.track)track(t.dataset.track,{});
  const a=t.dataset.act;if(!a)return;
  const id=t.dataset.id,v=t.dataset.v;
  switch(a){
    case "menu":openMenu();break;
    case "search":openSearch();break;
    case "cart":openDrawer();break;
    case "close":if(e.target===t||t.tagName==="BUTTON")closeLayer();break;
    case "add":if(addToCart(id,v,1)){openDrawer()}break;
    case "fav":e.preventDefault();toggleSel(id);if(currentRoute==="selecao")rerender();break;
    case "hs-go":{hsSet(+t.dataset.i+1,true);break}
    case "ds":{dsI=+t.dataset.i;dsV=0;$("#dsBox").innerHTML=dsInner();const b=$(`#dsBox [data-act="ds"][data-i="${dsI}"]`);if(b)b.focus({preventScroll:true});break}
    case "dsv":{dsV=+t.dataset.k;$("#dsBox").innerHTML=dsInner();break}
    case "show":{const sh=$("#show");if(sh){sh.innerHTML=showcaseInner(+t.dataset.i);const b=sh.querySelector(`[data-i="${t.dataset.i}"]`);if(b)b.focus({preventScroll:true})}break}
    case "view":{const p=bySlug(currentRoute.slice(2));const vw=p&&p.views[+t.dataset.i];if(!vw)break;const img=$("#pdpImg");img.src=vw.src;const st=viewStyle(vw);img.dataset.base=st;img.setAttribute("style",st);$("#zoom").classList.remove("on");document.querySelectorAll(".thumb").forEach(b=>b.setAttribute("aria-pressed",b===t));$("#photoCap").textContent=vw.label+" · "+variantLabel(p.variants[0]);break}
    case "sel-":case "sel+":{const x=getSel();const it=x.find(y=>y.id===id);if(!it)break;it.qty=Math.max(1,Math.min(20,it.qty+(a==="sel+"?1:-1)));setSel(x);rerender();break}
    case "sel-rm":setSel(getSel().filter(y=>y.id!==id));rerender();toast("Removida da tua seleção.");break;
    case "sel-wa":track("whatsapp_click",{source:"selecao",items:getSel().length});break;
    case "wa-send":{const c=normalizeCart();if(!c.lines.length){e.preventDefault();toast("O teu carrinho está vazio.");break}if(!waValid()){e.preventDefault();rerenderKeepFocus();setTimeout(()=>{const f=document.querySelector(".field.invalid .input");if(f)f.focus()},30);break}t.href=waLink(waMessage(c));track("whatsapp_click",{source:"finalizar",items:c.count});wa.sent=true;setTimeout(rerender,400);break}
    case "wa-done":setCart([]);wa={name:wa.name,phone:wa.phone,zone:wa.zone,city:wa.city,notes:"",ref:"",errors:{},sent:false};toast("Obrigada! A Vitrinii vai responder-te no WhatsApp.");location.hash="inicio";break;
    case "copy-wa":{const tx=$("#waText")?$("#waText").value:waMessage(cartLines());copyText(tx,$("#waText"));break}
    case "copy-sel":copyText($("#selText").value,$("#selText"));break;
    case "sel-cart":{let n=0;getSel().forEach(x=>{const p=byId(x.id);if(orderable(p)&&addToCart(p.id,p.variants[0].id,x.qty))n++});if(n)openDrawer();break}
    case "quick":{const p=byId(id);if(!p)break;if(purchasable(p)){if(addToCart(p.id,p.variants[0].id,1))openDrawer()}else{if(!inSel(id))toggleSel(id);else toast("Já está na tua seleção.");document.querySelectorAll(`.hover-cta[data-id="${id}"] span`).forEach(x=>x.textContent="Na tua seleção")}break}
    case "order-wa":{const p=byId(id);const q=Math.max(1,parseInt(($("#qty")||{}).value||"1",10));if(p)t.href=waLink(orderText(p,q));track("whatsapp_click",{ref:p&&p.ref,source:"encomendar"});break}
    case "copy-share":{const tx=t.dataset.text;try{navigator.clipboard.writeText(tx).then(()=>toast("Copiado."),()=>toast("Não foi possível copiar."))}catch(err){toast("Não foi possível copiar.")}break}
    case "add-pdp":
    case "add-pdp-cart":{const vid=(document.querySelector('input[name="variant"]:checked')||{}).value;if(!vid){toast("Escolhe uma variante.");break}const q=Math.max(1,parseInt(($("#qty")||{}).value||"1",10));if(addToCart(id,vid,q))openDrawer();break}
    case "qty-":{const q=$("#qty");q.value=Math.max(1,(+q.value||1)-1);break}
    case "qty+":{const q=$("#qty");q.value=Math.min(+q.max||20,(+q.value||1)+1);break}
    case "line-":case "line+":{const c=getCart();const l=c.find(x=>x.id===id&&x.v===v);if(!l)break;l.qty+=a==="line+"?1:-1;const p=byId(id);if(p)l.qty=Math.min(l.qty,l.pre?5:maxQty(p));setCart(l.qty<1?c.filter(x=>x!==l):c);refreshCartViews();break}
    case "line-rm":setCart(getCart().filter(x=>!(x.id===id&&x.v===v)));refreshCartViews();toast("Peça removida do carrinho.");break;
    case "clear-filters":shopState={q:"",colors:[],tones:[],styles:[],avail:false,min:"",max:"",sort:shopState.sort,cats:[]};rerender();break;
    case "demo-on":mode="demo";LS.set("vt_mode","demo");toast("Modo demonstração ativo.");closeLayer();route();break;
    case "demo-off":mode="real";LS.set("vt_mode","real");toast("Modo demonstração desligado.");route();break;
    case "co-back":co.step=Math.max(1,co.step-1);co.errors={};rerender();break;
    case "co-go":co.step=+t.dataset.step;co.errors={};rerender();break;
    case "pay-check":{const o=Server.checkExpiry(t.dataset.ref);toast(o?"Estado: "+PAY[o.payment.status][0]:"Encomenda não encontrada.");rerender();break}
    case "sim":{const o=Server.get(t.dataset.ref);const at=o.payment.attempts[o.payment.attempts.length-1];Server.notify(t.dataset.ref,"N-"+at.id,t.dataset.s);if(t.dataset.s==="confirmado")track("purchase_confirmed",{ref:o.ref,value:o.total/100});rerender();break}
    case "sim-dup":{const o=Server.get(t.dataset.ref);const at=o.payment.attempts[o.payment.attempts.length-1];Server.notify(t.dataset.ref,"N-"+at.id,"confirmado");toast("Notificação repetida ignorada. Sem cobrança nem encomenda duplicada.");break}
    case "pay-retry":{const o=Server.get(t.dataset.ref);const meth=($("#retryMethod")||{}).value||o.payment.method||"mbway";const ph=(($("#retryPhone")||{}).value||o.customer.mbPhone||"").replace(/\D/g,"").slice(-9);if(meth==="mbway"&&!/^9\d{8}$/.test(ph)){toast("Indica um telemóvel MB WAY com 9 dígitos.");break}if(meth==="mbway"){o.customer.mbPhone=ph;Server.save(o)}try{Server.startPayment(t.dataset.ref,meth,{phone:ph})}catch(err){toast(err.message)}rerender();break}
    case "copy-mb":{try{navigator.clipboard.writeText(t.dataset.text).then(()=>toast("Dados copiados."),()=>toast("Seleciona os dados para copiar."))}catch(err){toast("Seleciona os dados para copiar.")}break}
    case "preorder":{const p=byId(id);if(!p)break;const q=Math.max(1,parseInt(($("#qty")||{}).value||"1",10));if(addToCart(p.id,p.variants[0].id,q,true)){toast("Encomenda de peça esgotada adicionada ao carrinho.");openDrawer()}break}
    case "restock-open":{const f=document.querySelector('form[data-form="restock"]');if(f){f.hidden=!f.hidden;if(!f.hidden){f.scrollIntoView({block:"center",behavior:"smooth"});setTimeout(()=>$("#rs_email").focus(),300)}}break}
    case "restock-done":{const l=restockList();l.forEach(r=>{if(r.pid===t.dataset.pid)r.notified=true});LS.set("vt_restock",l);toast("Pedidos marcados como avisados.");rerender();break}
    case "wa-order":{track("whatsapp_click",{ref:t.dataset.ref});const o=Server.get(t.dataset.ref);if(o){o.log.push({t:Date.now(),m:"Cliente abriu a ligação do WhatsApp (envio não confirmado)"});Server.save(o)}break}
    case "copy-sum":copyText($("#sumText").value,$("#sumText"));break;
    case "copy-num":{try{navigator.clipboard.writeText(BRAND.waDisplay).then(()=>toast("Número copiado."),()=>toast("Seleciona o número para copiar."))}catch(err){toast("Seleciona o número para copiar.")}break}
    case "admin-in":adminIn=true;rerender();break;
    case "admin-out":adminIn=false;rerender();break;
    case "admin-tab":adminTab=t.dataset.tab;rerender();break;
    case "save-products":{
      const adm=adminCat();const errs=[];
      document.querySelectorAll("tr[data-pid]").forEach(tr=>{
        const pid=tr.dataset.pid;const g=k=>tr.querySelector(`[data-k="${k}"]`);
        const price=toCents(g("price").value);const sv=g("stock").value.trim();const stock=sv===""?null:Math.max(0,parseInt(sv,10)||0);
        let status=g("status").value;const name=g("name").value.trim();
        if(status==="publicado"&&price==null){errs.push(name);status="rascunho"}
        const prev=adm[pid]||{};
        adm[pid]={name,ref:g("ref").value.trim(),cat:g("cat").value,price,stock,status,featured:g("featured").checked,order:parseInt(g("order").value,10)||0,publishedAt:status==="publicado"?(prev.publishedAt||Date.now()):null};
      });
      LS.set("vt_admin_catalog",adm);
      rerender();
      const m=$("#prodMsg");if(m)m.innerHTML=errs.length?`<span style="color:var(--bad);font-weight:600">Guardado. Ficaram em rascunho por falta de preço: ${errs.map(esc).join(", ")}.</span>`:`<span style="color:var(--ok);font-weight:600">Produtos guardados.</span>`;
      break}
    case "save-ship":{const s={};document.querySelectorAll("tr[data-zone]").forEach(tr=>{s[tr.dataset.zone]={price:toCents(tr.querySelector('[data-k="price"]').value),days:tr.querySelector('[data-k="days"]').value.trim()}});LS.set("vt_admin_shipping",s);toast("Portes guardados.");rerender();break}
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.f){
    const f=t.dataset.f;
    if(f==="avail")shopState.avail=t.checked;
    else if(f==="min"||f==="max")shopState[f]=t.value;
    else{const arr=shopState[f];if(t.checked){if(!arr.includes(t.value))arr.push(t.value)}else shopState[f]=arr.filter(x=>x!==t.value)}
    document.querySelectorAll(`[data-f="${f}"]`).forEach(x=>{if(x===t)return;if(x.type==="checkbox"&&x.value===t.value)x.checked=t.checked;if(x.type==="checkbox"&&f==="avail")x.checked=t.checked;if(f==="min"||f==="max")x.value=t.value});
    renderResults(CATS.some(c=>c.id===currentRoute)?currentRoute:null);
  }
  if(t.id==="shopSort"){shopState.sort=t.value;renderResults(CATS.some(c=>c.id===currentRoute)?currentRoute:null)}
  if(t.dataset.wa==="zone"){wa.zone=t.value;rerenderKeepFocus()}
  if(t.dataset.co){const k=t.dataset.co;co.data[k]=t.type==="checkbox"?t.checked:t.value;if(k==="mbAlt"||k==="pay"||k==="country"||(k==="cp"&&co.step===2))rerenderKeepFocus()}
  if(t.dataset.act==="line-set"){const c=getCart();const l=c.find(x=>x.id===t.dataset.id&&x.v===t.dataset.v);if(l){const p=byId(l.id);l.qty=Math.max(1,Math.min(p?(l.pre?5:maxQty(p)):1,parseInt(t.value,10)||1));setCart(c);refreshCartViews()}}
  if(t.dataset.act==="trkcode"){const o=Server.get(t.dataset.ref);if(o){o.tracking=t.value.trim();o.log.push({t:Date.now(),m:"Seguimento: "+o.tracking});Server.save(o);toast("Código de seguimento guardado.")}}
  if(t.id==="sitePayToggle"){LS.set("vt_admin_sitepay",t.checked);toast(t.checked?"Pagamento no site ativado.":"Encomendas pelo WhatsApp.");return}
  if(t.dataset.pm){const cfg=Object.assign({mbway:true,card:true,klarna:true,multibanco:true},LS.get("vt_admin_paymethods",{}));cfg[t.dataset.pm]=t.checked;if(!Object.values(cfg).some(Boolean)){t.checked=true;toast("Mantém pelo menos um método de pagamento.");return}LS.set("vt_admin_paymethods",cfg);toast("Métodos de pagamento atualizados.")}
  if(t.dataset.act==="ff"){const o=Server.get(t.dataset.ref);if(o){o.fulfillment=t.value;o.log.push({t:Date.now(),m:"Envio: "+SHIP[t.value]});Server.save(o);toast("Estado do envio atualizado.")}}
  if(t.name==="variant"){/* cada variante tem fotografia identificada */const p=bySlug(currentRoute.slice(2));const v=p&&p.variants.find(x=>x.id===t.value);if(v){$("#photoCap").textContent="Fotografia da variante: "+variantLabel(v)}}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.trk){trk[t.dataset.trk]=t.value}
  if(t.dataset.wa){wa[t.dataset.wa]=t.value;if(wa.errors[t.dataset.wa]){delete wa.errors[t.dataset.wa];const f=t.closest(".field");if(f){f.classList.remove("invalid");const er=f.querySelector(".err");if(er)er.remove()}}waRefresh()}
  if(t.id==="selCity"){selCity=t.value;const m=selMessage(selCity);$("#selText").value=m;$("#selWa").href=waLink(m)}
  if(t.id==="shopSearch"){shopState.q=t.value;renderResults(CATS.some(c=>c.id===currentRoute)?currentRoute:null)}
  if(t.dataset.co&&t.type!=="checkbox"){co.data[t.dataset.co]=t.value;if(t.dataset.co==="cp"&&co.data.country==="PT"){let v=t.value.replace(/[^\d]/g,"").slice(0,7);if(v.length>4)v=v.slice(0,4)+"-"+v.slice(4);t.value=v;co.data.cp=v}}
});
document.addEventListener("submit",e=>{
  const f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();
  const s=f.dataset.form;
  if(s==="restock"){const em=$("#rs_email").value.trim(),ph=$("#rs_phone").value.trim(),ok=$("#rs_ok").checked,er=$("#rs_err");
    const msg=!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)?"Indica um e-mail válido.":!ok?"Para pedir o aviso, aceita ser contactada.":"";
    if(msg){er.textContent=msg;er.hidden=false;return}
    const pid=f.dataset.id;const p=byId(pid);const l=restockList();
    if(!l.some(r=>r.pid===pid&&r.email.toLowerCase()===em.toLowerCase()&&!r.notified))l.push({pid,ref:p.ref,name:p.name,email:em,phone:ph,at:Date.now(),notified:false,mine:true});
    LS.set("vt_restock",l);track("back_in_stock_request",{ref:p.ref});
    f.outerHTML=`<div class="callout ok"><b>Aviso pedido</b><span>Vamos avisar-te em ${esc(em)} quando a peça voltar ao stock.</span></div>`;return}
  if(s==="trk"){const r=trk.ref.trim().toUpperCase(),em=trk.email.trim().toLowerCase();const o=Server.get(r);
    if(!o||o.customer.email.toLowerCase()!==em){trk.err="Não encontrámos nenhuma encomenda com esta referência e este e-mail.";rerender();return}
    trk.err="";granted.add(r);location.hash="encomenda-"+r;return}
  if(s==="wa"){const b=$("#waSend");if(b)b.click();return}
  if(s==="company"){const c=company();f.querySelectorAll("[data-c]").forEach(x=>c[x.dataset.c]=x.value.trim());LS.set("vt_admin_company",c);toast("Dados da empresa guardados.");rerender();return}
  const step=+s;
  if(!validate(step)){rerender();const first=document.querySelector(".field.invalid .input,[aria-invalid]");if(first)first.focus();return}
  if(step<3){co.step=step+1;rerender();window.scrollTo({top:0});return}
  // validação de stock/preço antes de registar
  placeOrder($("#placeBtn"));
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#layer").innerHTML)closeLayer()});
let firstNav=true;
function navigate(){
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;const v=$("#veil"),app=$("#app");
  if(reduce){route();return}
  v.classList.add("on");
  setTimeout(()=>{route();app.classList.remove("enter");void app.offsetWidth;app.classList.add("enter");requestAnimationFrame(()=>v.classList.remove("on"))},230);
}
window.addEventListener("hashchange",navigate);
/* esteira das categorias: anda sozinha para a direita e pode ser arrastada */
const CB={el:null,belt:null,x:0,setW:0,drag:false,hover:false,last:0,sx:0,so:0,moved:false,resumeAt:0,pid:null};
const CB_SECONDS=38;
function cbWrap(){if(!CB.setW)return;while(CB.x>=0)CB.x-=CB.setW;while(CB.x<-CB.setW)CB.x+=CB.setW}
function cbMeasure(){if(CB.el){CB.setW=CB.el.scrollWidth/3;cbWrap()}}
function cbBind(belt){
  belt.addEventListener("pointerdown",e=>{if(e.button!==0)return;CB.drag=true;CB.moved=false;CB.sx=e.clientX;CB.so=CB.x;CB.pid=e.pointerId});
  belt.addEventListener("pointermove",e=>{if(!CB.drag||e.pointerId!==CB.pid)return;const dx=e.clientX-CB.sx;if(!CB.moved&&Math.abs(dx)>6){CB.moved=true;belt.classList.add("dragging");try{belt.setPointerCapture(e.pointerId)}catch(_){}}if(CB.moved){CB.x=CB.so+dx;cbWrap()}});
  const end=e=>{if(!CB.drag)return;CB.drag=false;belt.classList.remove("dragging");try{belt.releasePointerCapture(CB.pid)}catch(_){}if(e.pointerType!=="mouse")CB.resumeAt=performance.now()+1200};
  belt.addEventListener("pointerup",end);belt.addEventListener("pointercancel",end);
  belt.addEventListener("click",e=>{if(CB.moved){e.preventDefault();e.stopPropagation();CB.moved=false}},true);
  belt.addEventListener("pointerenter",e=>{if(e.pointerType==="mouse")CB.hover=true});
  belt.addEventListener("pointerleave",e=>{if(e.pointerType==="mouse")CB.hover=false});
  belt.addEventListener("dragstart",e=>e.preventDefault());
}
function cbFrame(t){
  const el=document.querySelector(".cat-track");
  if(el!==CB.el){CB.el=el;CB.drag=false;CB.hover=false;if(el){CB.belt=el.parentNode;cbBind(CB.belt);CB.setW=el.scrollWidth/3;CB.x=-CB.setW}}
  if(el){
    if(!CB.setW)cbMeasure();
    const dt=Math.min(64,t-(CB.last||t));
    const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(!CB.drag&&!CB.hover&&!still&&t>CB.resumeAt&&CB.setW){CB.x+=CB.setW/CB_SECONDS*dt/1000;cbWrap()}
    el.style.transform="translateX("+CB.x.toFixed(2)+"px)";
  }
  CB.last=t;requestAnimationFrame(cbFrame);
}
window.addEventListener("resize",cbMeasure);
window.addEventListener("load",cbMeasure);
requestAnimationFrame(cbFrame);
window.addEventListener("storage",e=>{if(e.key&&e.key.startsWith("vt_cart"))updateCount()});
route();
})();
